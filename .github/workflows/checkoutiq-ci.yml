name: CheckoutIQ CI / CD Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-assurance:
    name: Typecheck, Build & Playwright E2E Suite
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Static Type Checking
        run: npm run typecheck

      - name: Production Bundle Build
        run: npm run build

      - name: Execute End-to-End Playwright Automation Suite
        run: npm test

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-report
          path: evidence/test-reports/
          retention-days: 14
